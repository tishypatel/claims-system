<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ClaimsHub</title>
  <script>
    // SPA fallback: when Vercel serves this 404.html for an unknown path,
    // store the intended route and redirect to / so React Router can handle it.
    sessionStorage.setItem('_spa_redirect', window.location.pathname + window.location.search + window.location.hash);
    window.location.replace('/');
  </script>
</head>
<body></body>
</html>
